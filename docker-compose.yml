# ============================================================
# Java 反序列化靶场 — 一键部署文件
# 用法: docker compose up -d
# 访问: http://localhost:81
#
# 镜像已预构建并推送到阿里云 ACR，无需本地编译
# ============================================================
services:
  javaser-apps:
    image: crpi-4exq63xzgbecpu58.cn-chengdu.personal.cr.aliyuncs.com/mcc0624/java-deserialization-lab:latest
    container_name: javaserial-lab
    ports:
      - "81:8080"
    environment:
      CATALINA_OPTS: "-Djdk.xml.enableTemplatesImplDeserialization=true"
    restart: always