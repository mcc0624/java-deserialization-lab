# ============================================================
# Java 反序列化靶场 — Docker Compose 部署文件
# 用法: docker compose up -d
# 访问: http://localhost:81
# ============================================================
services:
  # ============================================================
  # Tomcat 应用服务器 — 运行所有靶场模块 + 首页
  # ============================================================
  javaser-apps:
    build: .
    container_name: javaserial-lab
    ports:
      - "81:8080"
    environment:
      CATALINA_OPTS: "-Djdk.xml.enableTemplatesImplDeserialization=true"
    restart: always
