networks:
  my_custom_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

services:
  # ============================================================
  # Tomcat 应用服务器 — 运行所有靶场模块
  # ============================================================
  javaser-apps:
    build: .
    container_name: app-multi
    ports:
      - "8080:8080"
    environment:
      CATALINA_OPTS: "-Djdk.xml.enableTemplatesImplDeserialization=true"
    restart: always
    networks:
      my_custom_network:
        ipv4_address: 172.20.0.10
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ============================================================
  # Apache HTTPD 反向代理 — 统一入口，端口 81→80
  # ============================================================
  apache:
    build:
      context: .
      dockerfile: Dockerfile.apache
    container_name: web
    restart: always
    networks:
      my_custom_network:
        ipv4_address: 172.20.0.5
    ports:
      - "81:80"
    depends_on:
      - javaser-apps
